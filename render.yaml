services:
  - type: web
    name: mimun-api
    runtime: docker
    plan: free
    rootDir: Backend
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AUTH_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      - key: AUTH_RATE_LIMIT_ATTEMPTS
        value: "10"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "60"